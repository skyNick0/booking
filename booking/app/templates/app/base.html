{% load static %}
<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Stayline{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'app/styles.css' %}">
</head>
<body>
  <header class="topbar">
    <nav class="nav" aria-label="Головна навігація">
      <a class="brand" href="{% url 'home' %}">Stayline</a>
      <div class="nav-links">
        <a href="{% url 'home' %}" {% if request.resolver_match.url_name == 'home' %}aria-current="page"{% endif %}>Огляд</a>
        <a href="{% url 'room_list' %}" {% if request.resolver_match.url_name == 'room_list' %}aria-current="page"{% endif %}>Кімнати</a>
        <a href="{% url 'booking_list' %}" {% if request.resolver_match.url_name == 'booking_list' %}aria-current="page"{% endif %}>Бронювання</a>
        <a class="nav-cta" href="{% url 'booking_create' %}">Нове бронювання</a>
      </div>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Stayline · Керування бронюваннями</footer>
</body>
</html>
